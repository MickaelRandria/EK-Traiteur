    <!-- Prevent getter-only fetch property exceptions in sandboxed iframe environments -->
    <script>
      (function() {
        try {
          var target = window;
          while (target) {
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (desc) {
              if (desc.get && !desc.set) {
                var currentFetch = window.fetch;
                try {
                  Object.defineProperty(target, 'fetch', {
                    get: function() { return currentFetch; },
                    set: function(val) { currentFetch = val; },
                    configurable: true,
                    enumerable: true
                  });
                } catch (err) {
                  try {
                    Object.defineProperty(window, 'fetch', {
                      get: function() { return currentFetch; },
                      set: function(val) { currentFetch = val; },
                      configurable: true,
                      enumerable: true
                    });
                  } catch (e2) {}
                }
              }
              break;
            }
            target = Object.getPrototypeOf(target);
          }
        } catch (e) {}

        // Global safety net for getter-only property assignments in iframe
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        });
      })();
    </script>
